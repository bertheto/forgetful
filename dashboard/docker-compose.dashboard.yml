services:
  forgetful-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: forgetful-dashboard:local
    container_name: forgetful-dashboard
    ports:
      - "8021:8021"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8021/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: forgetful-dashboard-net
